{% extends 'base.html' %}{% block content %}<div class="card"><h2>{{d.strftime('%A, %B %-d, %Y')}}</h2><p>Scheduled: <strong>{{scheduled|g}} hours</strong></p><form method="post" id="entryForm"><div id="rows">{% if segs %}{% for s in segs %}<div class="segment-row"><select name="type">{% for t in leave_types %}<option {% if t==s.segment_type %}selected{% endif %}>{{t}}</option>{% endfor %}</select><input name="hours" type="number" min="0" step="0.25" value="{{s.hours}}"><button type="button" onclick="this.parentElement.remove()">×</button></div>{% endfor %}{% else %}<div class="segment-row"><select name="type">{% for t in leave_types %}<option>{{t}}</option>{% endfor %}</select><input name="hours" type="number" min="0" step="0.25" value="{{scheduled|g}}"><button type="button" onclick="this.parentElement.remove()">×</button></div>{% endif %}</div><button type="button" class="ghost" onclick="addRow()">+ Add row</button><label>Notes<textarea name="notes">{{entry.notes if entry else ''}}</textarea></label><button>Save entry</button></form></div>
<script>function addRow(){const d=document.createElement('div');d.className='segment-row';d.innerHTML=`<select name="type">{% for t in leave_types %}<option>{{t}}</option>{% endfor %}</select><input name="hours" type="number" min="0" step="0.25" value="0"><button type="button" onclick="this.parentElement.remove()">×</button>`;document.querySelector('#rows').appendChild(d)}</script>{% endblock %}
