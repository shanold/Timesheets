{% extends 'base.html' %}{% block content %}<div class="card"><h2>Site branding</h2><form method="post" enctype="multipart/form-data"><label>Site name<input name="site_name" value="{{site.site_name}}" placeholder="Bob's Burgers Time Management"></label><label>Banner text<input name="banner_text" value="{{site.banner_text}}"></label><label>Logo image<input name="logo" type="file" accept="image/*"></label><label>Banner/background image<input name="banner" type="file" accept="image/*"></label><button>Save branding</button></form><p class="muted">Upload a logo and/or banner image. Existing images remain in place if you leave a file field blank.</p></div>{% endblock %}
